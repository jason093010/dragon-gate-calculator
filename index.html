<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>射龍門終極計算器 v12</title>
<style>
  :root {
    --bg-color: #f4f7f6; --card-bg: #ffffff; --text-color: #333333;
    --heading-color: #2c3e50; --border-color: #cccccc; --input-bg: #ffffff;
    --history-bg: #f9f9f9; --highlight-bg: rgba(241, 196, 15, 0.3);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0;
      --heading-color: #f39c12; --border-color: #444444; --input-bg: #2c2c2c;
      --history-bg: #2a2a2a; --highlight-bg: rgba(243, 156, 18, 0.4);
    }
  }

  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; margin: 0; transition: all 0.3s; }
  .card { background: var(--card-bg); border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); position: relative; }
  
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .header-row h2 { margin: 0; color: var(--heading-color); font-size: 20px; }
  
  .btn-help { background-color: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; }
  label { font-size: 13px; color: #7f8c8d; font-weight: bold; }
  input, select { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 5px; font-size: 16px; background-color: var(--input-bg); color: var(--text-color); }
  
  button { padding: 12px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; color: white; font-weight: bold; transition: opacity 0.2s, transform 0.1s; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .btn-full { width: 100%; background-color: #3498db; margin: 10px 0; }
  .btn-danger { background-color: #c0392b; width: 100%; margin-top: 10px; }
  .btn-undo { background-color: #636e72; flex: 1; }
  .btn-transfer { background-color: #00b894; flex: 1; }
  .btn-sort { background-color: #0984e3; width: 100%; margin-top: 10px; }
  
  .input-group { display: flex; gap: 8px; align-items: center; margin: 5px 0; }
  .input-group input { flex: 1; margin: 0; }
  .btn-allin { background-color: #8e44ad; width: auto; white-space: nowrap; padding: 10px 15px; }
  
  .quick-bet-row { display: flex; gap: 5px; margin-top: 5px; }
  .btn-quick { background-color: #8e44ad; font-size: 13px; padding: 8px 4px; flex: 1; }
  
  .action-grid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 15px; }
  .action-btn { width: calc(50% - 4px); margin: 0; padding: 15px 5px; font-size: 15px;}
  
  .btn-win { background-color: #2ecc71; }
  .btn-lose { background-color: #e74c3c; }
  .btn-post { background-color: #f1c40f; color: #333; }
  .btn-post-triple { background-color: #d35400; color: white; }
  
  .bottom-action-row { display: flex; gap: 8px; margin-top: 8px; align-items: stretch; }
  .bottom-action-row input { width: 25%; margin: 0; text-align: center; }
  .btn-add-pot { background-color: #34495e; width: 40%; font-size: 14px; }
  .btn-pass { background-color: #95a5a6; width: 35%; font-size: 14px; }
  
  .player-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px solid var(--border-color); font-size: 18px; }
  .active-player-row { background-color: var(--highlight-bg); border-radius: 5px; border-bottom: none; font-weight: bold; }
  .player-row input[type="number"] { width: 100px; text-align: right; margin: 0; padding: 8px; color: #e74c3c; background-color: var(--input-bg); border: 1px dashed #e67e22; }
  
  .pot-display { font-size: 32px; font-weight: bold; color: #e67e22; text-align: center; margin: 10px 0; }
  .wake-lock-status { font-size: 11px; text-align: center; color: #2ecc71; margin-top: -5px; margin-bottom: 10px; }

  .history-box { max-height: 120px; overflow-y: auto; background: var(--history-bg); padding: 8px; border-radius: 5px; font-size: 13px; border: 1px solid var(--border-color); }
  
  #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 3000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 16px; font-weight: bold; opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
  #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
  #toast.win { background-color: #27ae60; }
  #toast.lose { background-color: #c0392b; }

  .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.75); backdrop-filter: blur(4px); }
  .modal-content { background-color: var(--card-bg); margin: 8vh auto; padding: 20px; border-radius: 12px; width: 85%; max-width: 400px; max-height: 85vh; overflow-y: auto; position: relative; color: var(--text-color); }
  .close-modal { color: #aaa; position: absolute; right: 15px; top: 10px; font-size: 28px; cursor: pointer; }
</style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <h2>💰 底池與規則</h2>
    <button class="btn-help" onclick="openModal('helpModal')">📖 說明</button>
  </div>
  <div class="wake-lock-status" id="wakeStatus">● 螢幕常亮已啟動</div>
  <label>注入底池金額:</label>
  <input type="number" id="initPot" value="500">
  <button class="btn-full" onclick="setPot()">🚀 確認注入底池</button>
  <div class="pot-display"><small style="font-size: 14px;">目前底池</small><br><span id="currentPot">0</span></div>
  <div class="input-group">
      <button class="btn-undo" onclick="undo()">↩️ 復原上步</button>
      <button class="btn-transfer" onclick="openModal('transferModal')">💸 玩家轉帳</button>
  </div>
</div>

<div class="card">
  <h2>👥 玩家管理</h2>
  <div class="input-group">
    <input type="text" id="playerName" placeholder="名稱">
    <input type="number" id="playerBalance" value="1000" style="width: 100px; flex: none;">
  </div>
  <button class="btn-full" onclick="addPlayer()">➕ 加入玩家</button>
</div>

<div class="card">
  <h2>🎮 遊戲進行</h2>
  <select id="activePlayer" onchange="updateUI()"></select>
  <label>下注金額:</label>
  <input type="number" id="betAmount" value="50">
  <div class="quick-bet-row">
    <button class="btn-quick" onclick="setFraction(1/3)">1/3</button>
    <button class="btn-quick" onclick="setFraction(1/2)">1/2</button>
    <button class="btn-quick" onclick="setFraction(1)">🔥 梭哈</button>
  </div>
  <div class="action-grid">
    <button class="action-btn btn-win" onclick="playTurn('win')" id="btn-win">✅ 進門</button>
    <button class="action-btn btn-lose" onclick="playTurn('lose')" id="btn-lose">❌ 不進</button>
    <button class="action-btn btn-post" onclick="playTurn('post')" id="btn-post">💥 撞柱</button>
    <button class="action-btn btn-post-triple" onclick="playTurn('triple')" id="btn-triple">☠️ 對子撞</button>
  </div>
  <div class="bottom-action-row">
    <input type="number" id="addPotAmount" value="20">
    <button class="btn-add-pot" onclick="addPotEqually()" id="btn-add-pot">💰 平攤加碼</button>
    <button class="btn-pass" onclick="playTurn('pass')" id="btn-pass">⏭️ 過水</button>
  </div>
</div>

<div class="card">
  <h2>📊 結算排行榜</h2>
  <div id="playerList"></div>
  <button class="btn-sort" onclick="sortByRank()">🏆 依金額排行 (由高到低)</button>
</div>

<div class="card">
  <h2>📜 歷史紀錄</h2>
  <div id="historyBox" class="history-box"></div>
  <button class="btn-danger" onclick="resetGame()">🗑️ 清除所有紀錄 (開新局)</button>
</div>

<div id="helpModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('helpModal')">&times;</span>
    <h3>💡 射龍門 - 終極指南</h3>
    <h4>1. ↩️ 復原功能 (Undo)</h4>
    <ul><li>按錯了？點擊「復原上步」即可讓底池與籌碼回到動作前的狀態。</li></ul>
    <h4>2. 💸 玩家轉帳</h4>
    <ul><li>玩家私下借錢或給錢時使用，不影響底池。</li></ul>
    <h4>3. 🏆 排行榜</h4>
    <ul><li>點擊「依金額排行」，系統會自動幫大家從小排到大，結算超方便。</li></ul>
    <h4>4. 🔆 螢幕常亮</h4>
    <ul><li>只要打開此網頁，手機就不會自動休眠鎖定，方便大家輪流操作。</li></ul>
  </div>
</div>

<div id="transferModal" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('transferModal')">&times;</span>
    <h3>💸 玩家內部轉帳</h3>
    <label>從誰給錢 (From):</label>
    <select id="transferFrom"></select>
    <label>給誰錢 (To):</label>
    <select id="transferTo"></select>
    <label>轉帳金額:</label>
    <input type="number" id="transferAmount" value="100">
    <button class="btn-full" style="background-color:#00b894" onclick="executeTransfer()">確認轉帳</button>
  </div>
</div>

<div id="toast"></div>

<script>
  let pot = 0; let players = []; let historyLog = []; let historyStack = [];
  let multiplier = 2; let tripleMultiplier = 3; let isActionLocked = false;
  let wakeLock = null;

  window.onload = function() { loadBackupData(); requestWakeLock(); };

  function formatNum(num) { return Number.isInteger(num) ? num : parseFloat(num.toFixed(2)); }

  // --- 核心：快照備份 (用於 Undo) ---
  function pushState() {
    const state = JSON.stringify({ pot, players, historyLog: [...historyLog] });
    historyStack.push(state);
    if (historyStack.length > 10) historyStack.shift(); 
  }

  function undo() {
    if (historyStack.length === 0) return alert("沒有紀錄可以復原！");
    const lastState = JSON.parse(historyStack.pop());
    pot = lastState.pot; players = lastState.players; historyLog = lastState.historyLog;
    updateUI(); renderHistory(); saveBackupData();
    showToast("⏪ 已成功復原上一步！", "pass");
  }

  function requestWakeLock() {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').then(lock => {
        wakeLock = lock;
        document.getElementById('wakeStatus').innerText = "● 螢幕常亮已啟動";
      }).catch(err => {
        document.getElementById('wakeStatus').innerText = "○ 此設備不支援常亮";
      });
    }
  }

  function saveBackupData() {
    localStorage.setItem('DragonGateBackup_v12', JSON.stringify({ pot, players, historyLog }));
  }

  function loadBackupData() {
    const saved = localStorage.getItem('DragonGateBackup_v12');
    if (saved) {
      const d = JSON.parse(saved);
      pot = d.pot; players = d.players; historyLog = d.historyLog || [];
      updateUI(); renderHistory();
    }
  }

  function updateUI() {
    document.getElementById('currentPot').innerText = formatNum(pot);
    const select = document.getElementById('activePlayer');
    const fromSelect = document.getElementById('transferFrom');
    const toSelect = document.getElementById('transferTo');
    const currentIndex = select.value;

    [select, fromSelect, toSelect].forEach(s => {
      s.innerHTML = '';
      players.forEach((p, i) => {
        let opt = document.createElement('option'); opt.value = i; opt.innerHTML = p.name;
        s.appendChild(opt);
      });
    });
    if (currentIndex !== "" && currentIndex < players.length) select.value = currentIndex;
    renderPlayerList();
  }

  function renderPlayerList() {
    const list = document.getElementById('playerList');
    const activeIdx = parseInt(document.getElementById('activePlayer').value);
    list.innerHTML = '';
    players.forEach((p, i) => {
      const activeClass = (i === activeIdx) ? 'active-player-row' : '';
      list.innerHTML += `<div class="player-row ${activeClass}"><span class="name">${p.name}</span>
        <input type="number" step="any" value="${formatNum(p.balance)}" onchange="manualEdit(${i}, this.value)"></div>`;
    });
  }

  function manualEdit(i, val) {
    pushState();
    players[i].balance = parseFloat(val) || 0;
    saveBackupData(); updateUI();
  }

  function setPot() {
    pushState();
    const val = parseFloat(document.getElementById('initPot').value) || 0;
    if (players.length > 0) {
      const split = val / players.length;
      players.forEach(p => p.balance -= split);
      pot = val;
      addLog(`🚀 注入底池 ${val}，每人平攤扣除 ${formatNum(split)}`);
    } else {
      pot = val; addLog(`🚀 設定初始底池 ${val}`);
    }
    updateUI(); saveBackupData();
  }

  function addPlayer() {
    const n = document.getElementById('playerName').value;
    const b = parseFloat(document.getElementById('playerBalance').value) || 0;
    if (!n) return alert("請輸入名稱");
    pushState();
    players.push({ name: n, balance: b });
    document.getElementById('playerName').value = '';
    addLog(`➕ ${n} 加入 (初始 ${b})`);
    updateUI(); saveBackupData();
  }

  function sortByRank() {
    pushState();
    players.sort((a, b) => b.balance - a.balance);
    addLog(`🏆 重新按金額排行結算`);
    updateUI(); saveBackupData();
  }

  function executeTransfer() {
    const f = parseInt(document.getElementById('transferFrom').value);
    const t = parseInt(document.getElementById('transferTo').value);
    const amt = parseFloat(document.getElementById('transferAmount').value) || 0;
    if (f === t) return alert("不能轉帳給自己！");
    if (amt <= 0) return alert("請輸入有效金額");
    pushState();
    players[f].balance -= amt; players[t].balance += amt;
    addLog(`💸 轉帳: ${players[f].name} 給予 ${players[t].name} $${amt}`);
    closeModal('transferModal'); updateUI(); saveBackupData();
    showToast("💸 轉帳成功！", "pass");
  }

  function setFraction(f) { document.getElementById('betAmount').value = Math.floor(pot * f); }

  function playTurn(res) {
    if (players.length === 0) return alert("請先加入玩家");
    if (pot <= 0 && res !== 'pass') return alert("底池空了");
    if (isActionLocked) return;

    pushState();
    const idx = document.getElementById('activePlayer').value;
    const bet = parseFloat(document.getElementById('betAmount').value) || 0;
    const p = players[idx];

    isActionLocked = true; toggleBtns(true);
    let msg = ""; let type = res;

    if (res === 'pass') { msg = `【過水】${p.name} Pass`; addLog(`⏭️ ${p.name} 過水`); }
    else {
      if (bet > pot) { isActionLocked=false; toggleBtns(false); return alert("超過底池"); }
      if (res === 'win') { pot -= bet; p.balance += bet; msg = `✅ ${p.name} 贏得 ${bet}`; addLog(`✅ ${p.name} 贏 ${bet}`); }
      else if (res === 'lose') { pot += bet; p.balance -= bet; msg = `❌ ${p.name} 輸了 ${bet}`; addLog(`❌ ${p.name} 輸 ${bet}`); }
      else if (res === 'post') { const pen = bet * 2; pot += pen; p.balance -= pen; msg = `💥 撞柱！${p.name} 賠 ${pen}`; addLog(`💥 ${p.name} 撞柱賠 ${pen}`); }
      else if (res === 'triple') { const pen = bet * 3; pot += pen; p.balance -= pen; msg = `☠️ 對子撞！${p.name} 賠 ${pen}`; addLog(`☠️ ${p.name} 對子撞賠 ${pen}`); }
    }

    updateUI(); saveBackupData(); showToast(msg, type);
    setTimeout(() => { 
        let next = parseInt(idx) + 1; if (next >= players.length) next = 0;
        document.getElementById('activePlayer').value = next;
        updateUI(); isActionLocked = false; toggleBtns(false); 
    }, 800);
  }

  function addPotEqually() {
    const amt = parseFloat(document.getElementById('addPotAmount').value) || 0;
    if (amt <= 0 || players.length === 0) return;
    pushState();
    const split = amt / players.length;
    pot += amt; players.forEach(p => p.balance -= split);
    addLog(`💰 平攤加碼 ${amt} (每人-${formatNum(split)})`);
    updateUI(); saveBackupData(); showToast(`加碼 ${amt}`, "addpot");
  }

  function addLog(m) {
    const t = new Date().toLocaleTimeString();
    historyLog.unshift(`[${t}] ${m}`);
    if (historyLog.length > 20) historyLog.pop();
    renderHistory();
  }

  function renderHistory() {
    const b = document.getElementById('historyBox');
    b.innerHTML = historyLog.map(l => `<div style="border-bottom:1px dashed #444; padding:2px 0">${l}</div>`).join('');
  }

  function resetGame() {
    if (confirm("確定清除開新局？")) {
      localStorage.removeItem('DragonGateBackup_v12');
      location.reload();
    }
  }

  function toggleBtns(d) { ['btn-win', 'btn-lose', 'btn-post', 'btn-triple', 'btn-pass', 'btn-add-pot'].forEach(id => document.getElementById(id).disabled = d); }
  function showToast(m, t) { const s = document.getElementById("toast"); s.innerHTML = m; s.className = `show ${t}`; setTimeout(() => s.className = "", 2500); }
  function openModal(id) { document.getElementById(id).style.display = 'block'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  window.onclick = function(e) { if (e.target.className === 'modal') e.target.style.display = "none"; }
</script>

</body>
</html>
